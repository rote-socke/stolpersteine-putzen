<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stolpersteine putzen</title>
  <meta name="description" content="Gemeinsam Stolpersteine in Stuttgart putzen: Karte, nächste offene Steine, wer wohin unterwegs ist.">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Steine putzen">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="map-wrap">
    <div id="map" aria-label="Karte der Stolpersteine"></div>
    <div class="map-controls">
      <button type="button" id="group-button" class="map-button group-button" aria-haspopup="dialog">
        <span class="group-button-label" id="group-button-label">Keiner Gruppe beigetreten</span>
      </button>
      <div class="legend" id="legend">
      <button type="button" class="map-button legend-toggle" id="legend-toggle" aria-expanded="false" aria-controls="legend-body">Legende</button>
      <ul class="legend-body" id="legend-body" hidden>
        <li><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" class="lg-open"/></svg>Offen</li>
        <li><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" class="lg-own"/></svg>Ihr seid unterwegs</li>
        <li><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6" class="lg-other"/></svg>Andere Gruppe unterwegs</li>
        <li><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" class="lg-cleaned"/></svg>Geputzt</li>
        <li><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="11" r="5" class="lg-open"/><circle cx="14" cy="5" r="3" class="lg-note"/></svg>Mit Notiz</li>
        <li><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6" class="lg-me"/></svg>Dein Standort</li>
        <li><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="5.5" class="lg-mate"/></svg>Mitglied deiner Gruppe</li>
        <li><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="5.5" class="lg-peer"/></svg>Andere Gruppe</li>
      </ul>
      </div>
    </div>
    <button type="button" class="locate-button" id="locate-button" aria-label="Mein Standort" title="Mein Standort">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    </button>
  </main>

  <section class="sheet" id="sheet" aria-live="polite"></section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog class="dialog" id="group-dialog" aria-labelledby="group-dialog-title">
    <div class="dialog-inner">
      <div class="dialog-head">
        <h2 id="group-dialog-title">Gruppe</h2>
        <button type="button" class="icon-button" data-close aria-label="Schließen">&#x2715;</button>
      </div>
      <div id="group-dialog-body"></div>
    </div>
  </dialog>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/qrcode/qrcode.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
